<!-- JavaScript for Text Cycling -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const texts = document.querySelectorAll('.text-cycle-item');
            let currentIndex = 0;
            const cycleDuration = 3000; // 3 seconds per text

            function cycleText() {
                const currentElement = texts[currentIndex];
                
                // Calculate next index
                const nextIndex = (currentIndex + 1) % texts.length;
                const nextElement = texts[nextIndex];

                // Animate current out
                currentElement.classList.remove('active');
                currentElement.classList.add('exit');

                // Prepare next element (remove exit if it has it)
                nextElement.classList.remove('exit');
                
                // Slight delay before animating next element in to prevent overlap visual glitch
                setTimeout(() => {
                    nextElement.classList.add('active');
                }, 100);

                currentIndex = nextIndex;
            }

            // Start cycling
            if (texts.length > 1) {
                setInterval(cycleText, cycleDuration);
            }
        });
    </script>
